<!doctype html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117"><title>Aktien-Chart</title>
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-v8-512.png"><link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-v8-192.png"><link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png"><link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon-v8.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="application-name" content="ExSE Aktien"><meta name="apple-mobile-web-app-title" content="ExSE Aktien">
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#30363d;--txt:#e6edf3;--mut:#8b949e;--up:#26a69a;--down:#ef5350;--acc:#58a6ff}
*{box-sizing:border-box}html,body{margin:0;height:100%;height:100dvh;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{padding:8px 14px 2px}
.search{position:relative}
.search input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:16px;outline:none}
.search input:focus{border-color:var(--acc)}
#sugg{position:absolute;left:0;right:0;top:46px;background:var(--card);border:1px solid var(--line);border-radius:12px;z-index:20;overflow:hidden;display:none}
#sugg div{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}#sugg div:last-child{border:0}
#sugg b{color:var(--acc);margin-right:8px}#sugg span{color:var(--mut);font-size:12px;float:right}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0;scrollbar-width:none}
.chips button{flex:none;background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:5px 11px;font-size:13px}
.chips button.on{color:var(--txt);border-color:var(--acc)}
.quote{padding:4px 14px 0}
#name{font-size:14px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
#price{font-size:30px;font-weight:700;letter-spacing:-.5px;line-height:1.2}
#chg{font-size:16px;font-weight:600}
#state{font-size:12px;color:var(--mut);margin-top:2px}
#note{font-size:12px;color:var(--mut);margin-top:4px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--mut)}
.dot.live{background:var(--up);box-shadow:0 0 6px var(--up);animation:p 1.6s infinite}@keyframes p{50%{opacity:.35}}
#legend{padding:2px 14px;font-size:12px;color:var(--mut);min-height:18px;font-variant-numeric:tabular-nums}
#chartwrap{flex:1 1 0;min-height:140px;position:relative;margin:0 14px} /* Chart füllt die restliche Höhe, die Seite scrollt nicht */ /* gleicher Rand wie der Text (14px) */
#chart{position:absolute;inset:0}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);text-align:center;padding:20px;z-index:5;pointer-events:none}
.bar{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;padding:4px 6px 4px;gap:5px 8px}
.ranges{display:flex;gap:2px;flex:1 1 100%;justify-content:space-between} /* Zeiträume volle Breite, Kerzen|Linie zentriert darunter */
.ranges button,.tog button{background:transparent;border:0;color:var(--mut);font-size:14px;font-weight:600;padding:0 4px;min-height:32px;line-height:1.1;border-radius:8px;white-space:nowrap;text-align:center}
.ranges button{flex:1 1 0;min-width:fit-content}
.ranges button.on{background:#1f2937;color:var(--txt)}
.togs{flex:1 1 100%;display:grid;grid-template-columns:repeat(6,1fr);gap:5px 6px} /* 3 Spalten: oben 3 Schalter, unten 2 zentriert */
.togs .tog{grid-column:span 2}.togs .tog:nth-child(4){grid-column:2/span 2}
.togs.two{grid-template-columns:repeat(4,1fr)}.togs.two .tog:nth-child(4){grid-column:auto/span 2}.togs.two .tog:nth-child(5){grid-column:2/span 2}
.togs.one{grid-template-columns:1fr;max-width:16em;margin:0 auto}.togs.one .tog{grid-column:1/-1!important}
.tog{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.tog button{border-radius:0;padding:0 2px;min-height:30px;font-size:11px;min-width:0;overflow:hidden} /* alle Schalter gleich breit, Hälften gleich */.tog button.on{background:var(--acc);color:#0d1117}
.tog.dis{opacity:.4}.tog button:disabled{cursor:default}
footer{font-size:10px;color:#6e7681;text-align:center;padding:0 10px 6px;line-height:1.3}
</style></head><body>
<header>
    <div class="chips" id="chips"></div>
</header>
<div class="quote">
  <div id="name">–</div>
  <div class="pr"><span id="price">–</span><span id="chg"></span></div>
  <div id="state"></div><div id="fresh" style="font-size:12px;color:var(--mut);margin-top:2px"></div><div id="note"></div><div id="reallabel" style="display:none;font-size:12px;color:var(--mut);margin-top:2px"></div>
</div>
<div id="legend"></div>
<div id="chartwrap"><div id="chart"></div><div id="msg">Lade Kursdaten …</div></div>
<div class="bar">
  <div class="ranges" id="ranges"></div>
  <div class="togs" id="togs">
  <div class="tog"><button id="tCandle" class="on" title="Kerzen">Kerzen</button><button id="tArea" title="Linie">Linie</button></div>
  <div class="tog" id="pctTog"><button id="tKurs" class="on" title="Kurse in Handelswährung">Kurs</button><button id="tPct" title="Veränderung seit Beginn des Zeitraums">Prozent</button></div>
  <div class="tog" id="divTog"><button id="tNoDiv" class="on" title="Kurse ohne Dividenden">Ohne</button><button id="tDiv" title="Gesamtrendite inkl. Dividenden">Mit Div.</button></div>
  <div class="tog" id="realTog"><button id="tNom" class="on" title="Nominale Kurse">Nominal</button><button id="tReal" title="Inflationsbereinigte Kurse">Real</button></div>
  <div class="tog" id="goldTog"><button id="tCur" class="on" title="In der Handelswährung">Währung</button><button id="tGold" title="In Unzen Gold je Aktie">Gold</button></div>
  </div>
</div>
<footer>Daten: Yahoo Finance (ggf. verzögert) · Keine Anlageberatung · Version 1.7.1</footer>
<script src="./lwc.js"></script><script src="./app.js"></script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js',{scope:'./'});</script>
</body></html>
