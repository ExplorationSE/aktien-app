<!doctype html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117"><title>Aktien-Chart</title>
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#30363d;--txt:#e6edf3;--mut:#8b949e;--up:#26a69a;--down:#ef5350;--acc:#58a6ff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{padding:12px 14px 6px}
.search{position:relative}
.search input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:16px;outline:none}
.search input:focus{border-color:var(--acc)}
#sugg{position:absolute;left:0;right:0;top:46px;background:var(--card);border:1px solid var(--line);border-radius:12px;z-index:20;overflow:hidden;display:none}
#sugg div{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}#sugg div:last-child{border:0}
#sugg b{color:var(--acc);margin-right:8px}#sugg span{color:var(--mut);font-size:12px;float:right}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips button{flex:none;background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:5px 11px;font-size:13px}
.chips button.on{color:var(--txt);border-color:var(--acc)}
.quote{padding:6px 14px 0}
#name{font-size:14px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
#price{font-size:34px;font-weight:700;letter-spacing:-.5px}
#chg{font-size:16px;font-weight:600}
#state{font-size:12px;color:var(--mut);margin-top:2px}
#note{font-size:12px;color:var(--mut);margin-top:4px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--mut)}
.dot.live{background:var(--up);box-shadow:0 0 6px var(--up);animation:p 1.6s infinite}@keyframes p{50%{opacity:.35}}
#legend{padding:4px 14px;font-size:12px;color:var(--mut);min-height:18px;font-variant-numeric:tabular-nums}
#chartwrap{flex:1;min-height:300px;position:relative;margin:0 4px}
#chart{position:absolute;inset:0}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);text-align:center;padding:20px;z-index:5;pointer-events:none}
.bar{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 12px;gap:6px}
.ranges{display:flex;gap:2px;flex:1;justify-content:space-between}
.ranges button,.tog button{background:transparent;border:0;color:var(--mut);font-size:14px;font-weight:600;padding:8px 7px;border-radius:8px}
.ranges button.on{background:#1f2937;color:var(--txt)}
.tog{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tog button{border-radius:0;padding:7px 9px;font-size:13px}.tog button.on{background:var(--acc);color:#0d1117}
footer{font-size:10px;color:#6e7681;text-align:center;padding:0 10px 8px}
</style></head><body>
<header>
    <div class="chips" id="chips"></div>
  <div id="info" style="font-size:11px;color:#6e7681;padding-top:4px">Auswahl auf die festen Werte beschränkt – eine freie Suche ist in dieser Version ohne eigenen Server nicht möglich.</div>
</header>
<div class="quote">
  <div id="name">–</div>
  <div class="pr"><span id="price">–</span><span id="chg"></span></div>
  <div id="state"></div><div id="fresh" style="font-size:12px;color:var(--mut);margin-top:2px"></div><div id="note"></div>
</div>
<div id="legend"></div>
<div id="chartwrap"><div id="chart"></div><div id="msg">Lade Kursdaten …</div></div>
<div class="bar">
  <div class="ranges" id="ranges"></div>
  <div class="tog"><button id="tCandle" class="on" title="Kerzen">Kerzen</button><button id="tArea" title="Fläche">Linie</button></div>
</div>
<footer>Kursdaten: Yahoo Finance, automatisch abgerufen ca. alle 5–15 Min. (Kurse ggf. verzögert). Keine Anlageberatung.</footer>
<script src="./lwc.js"></script><script src="./app.js"></script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js',{scope:'./'});</script>
</body></html>
